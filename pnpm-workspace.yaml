# Build-Scripts sind in pnpm standardmäßig gesperrt — nur explizit freigeben.
allowBuilds:
  simple-git-hooks: true
  sharp: false
  unrs-resolver: false

# ESLint 10: die von eslint-config-next gebündelten Plugins deklarieren ESLint 10
# noch nicht als Peer, laufen aber damit (geprüft). Eintrag entfernen, sobald
# `pnpm peers check` auch ohne ihn sauber ist.
peerDependencyRules:
  allowedVersions:
    eslint: '10'

# Pakete, die sofort nach Release installiert werden dürfen (kein Warte-Fenster).
minimumReleaseAgeExclude:
  - '@commitlint/*'
  - '@supabase/*'
  - supabase
  - motion
  - framer-motion
  - motion-dom
  - motion-utils
